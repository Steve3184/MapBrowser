plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '8.3.0'
    id "de.undercouch.download" version "5.6.0"
}

group = 'top.steve3184.mapbrowser'
version = '1.0-beta3'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = 'https://repo.minceraft.dev/releases/'
        name = 'tjcserver'
    }
}
task downloadJcef(type: Download) {
    src 'https://github.com/Steve3184/mb_jcefbuild/releases/download/v1/jcef.jar'
    dest new File(layout.buildDirectory.get().toString(), 'libs/jcef.jar')
    overwrite false
}
tasks.withType(JavaCompile).configureEach {
    dependsOn downloadJcef
}
dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT")
    compileOnly("de.pianoman911:mapengine-api:1.8.9")
    // implementation("me.friwi:jcefmaven:116.0.19.1")
    implementation("me.friwi:jcefmaven:135.0.20")
    // implementation("me.friwi:jcef-api:jcef-37f25dc+cef-116.0.19+gc6a20bc+chromium-116.0.5845.141")
    implementation files(downloadJcef.dest)
}
tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.5")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}
build {
    dependsOn shadowJar
}
